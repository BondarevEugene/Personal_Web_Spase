name: OMNIFACTORY builder final workflow

on:
  pull_request:
    branches:
      - feat/founders-omni-editorial-20261116
    paths:
      - "api/builder_projects.py"
      - "tests/test_builder_final_workflow.py"
      - ".github/workflows/builder_final_workflow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Ruff
        run: python -m ruff check api/builder_projects.py tests/test_builder_final_workflow.py
      - name: Builder regression tests
        run: python -m pytest -q --tb=short tests/test_builder_final_workflow.py tests/test_builder_preflight_export_gate.py tests/test_builder_release_preflight.py tests/test_builder_simulator_runtime_parity.py tests/test_builder_runtime_resilience.py tests/test_builder_path_variables.py
