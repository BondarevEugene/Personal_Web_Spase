name: OMNIFACTORY staging acceptance

on:
  pull_request:
    branches:
      - feat/graph-runtime-incident-triage-20261121
      - main
    paths:
      - "scripts/verify_platform_staging.py"
      - "tests/test_platform_staging_smoke.py"
      - "omni_site/static/solution_demo.css"
      - "omni_site/templates/blueprint_studio.html"
      - "scripts/public_ux_audit.py"
      - "tests/test_blueprint_ux_audit_contract.py"
      - ".github/workflows/portal_staging_acceptance.yml"
  workflow_dispatch:
    inputs:
      staging_url:
        description: "HTTPS origin of a separate staging deployment (not production)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint and test tools
        run: python -m pip install "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Lint
        run: python -m ruff check scripts/verify_platform_staging.py tests/test_platform_staging_smoke.py tests/test_blueprint_ux_audit_contract.py
      - name: Test
        run: python -m pytest -q tests/test_platform_staging_smoke.py tests/test_blueprint_ux_audit_contract.py
      - name: Validate staging HTTP routes (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: python -m scripts.verify_platform_staging --base-url "$STAGING_URL"
