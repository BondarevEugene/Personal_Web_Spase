name: Graph Studio Telegram export contract
on:
  pull_request:
    paths:
      - "api/export_contract.py"
      - "api/simple_builder.py"
      - "scripts/verify_telegram_export.py"
      - "tests/test_export_contract.py"
      - "docs/GRAPH_TELEGRAM_RELEASE_ACCEPTANCE.md"
      - ".github/workflows/graph_telegram_export_contract.yml"
  workflow_dispatch:
jobs:
  export-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "ruff>=0.9,<1" "pytest>=8,<10"
      - run: python -m ruff check api/export_contract.py api/simple_builder.py scripts/verify_telegram_export.py tests/test_export_contract.py
      - run: python -m pytest -q tests/test_export_contract.py tests/test_builder_export_zip_acceptance.py tests/test_builder_export_acceptance.py tests/test_builder_simulator_runtime_parity.py
