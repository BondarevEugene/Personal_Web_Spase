name: OMNIFACTORY client workspace quality

on:
  pull_request:
    branches:
      - feat/graph-runtime-incident-triage-20261121
    paths:
      - "portal/**"
      - "omni_site/static/client_workspace.css"
      - "tests/test_client_workspace_premium_shell.py"
      - "server.py"
      - "tests/test_client_workspace_center.py"
      - "tests/test_client_decisions.py"
      - "tests/test_project_dialogue.py"
      - "tests/test_project_revision_gate.py"
      - "tests/test_project_archive.py"
      - "tests/test_project_handover_verification.py"
      - "tests/test_project_delivery_approval_gate.py"
      - "scripts/verify_project_archive.py"
      - ".github/workflows/client_workspace_quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMNI_PORTAL_DATABASE_URL: sqlite:///./workspace_quality.sqlite3
      OMNI_PORTAL_MIGRATION_URL: sqlite:///./workspace_quality.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Ruff workspace and regression tests
        run: python -m ruff check scripts/verify_project_archive.py tests/test_project_handover_verification.py portal/workspace_center.py portal/client_decisions.py portal/project_dialogue.py portal/project_archive.py tests/test_project_archive.py tests/test_project_revision_gate.py tests/test_project_dialogue.py tests/test_client_workspace_center.py tests/test_client_decisions.py tests/test_project_dialogue.py tests/test_project_revision_gate.py tests/test_project_archive.py tests/test_client_workspace_premium_shell.py
      - name: Alembic migrations
        run: python -m alembic -c portal_alembic.ini upgrade head
      - name: Client workspace regressions
        run: python -m pytest -q --tb=short tests/test_project_handover_verification.py tests/test_client_workspace_center.py tests/test_client_decisions.py tests/test_client_workspace_premium_shell.py
