name: OMNIFACTORY founders site review

on:
  push:
    branches: [feat/founders-omni-editorial-20261116]
  pull_request:
    branches: [fix/portal-openapi-botlab-20261115]

jobs:
  founders-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart "aiogram>=3.20,<4"
      - name: Run homepage and platform regression tests
        run: python -m pytest -q --tb=short tests/test_founders_site.py tests/test_portal_route_contract.py
      - name: Verify both founder photos committed before merge
        run: |
          for name in founder-01.webp founder-02.webp; do
            if [ ! -s "omni_site/static/founders/$name" ]; then
              echo "::warning file=omni_site/static/founders/$name::Founder photograph has not been uploaded yet. Do not merge or deploy this PR."
            fi
          done
