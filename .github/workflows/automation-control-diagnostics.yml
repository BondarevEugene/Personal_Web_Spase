name: Automation Flagship diagnostics

on:
  pull_request:
    paths:
      - "api/automation.py"
      - "automation/connector_diagnostics.py"
      - "tests/test_connector_diagnostics.py"
      - "routers/home.py"
      - "templates/automation_control.html"
      - "templates/automation_studio.html"
      - "omni_site/static/automation_control.*"
      - "tests/test_automation_control_center.py"
      - ".github/workflows/automation-control-diagnostics.yml"
  push:
    branches:
      - "feat/automation-integration-diagnostics-20261121"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Ruff on changed Python files
        run: python -m ruff check api/automation.py routers/home.py automation/connector_diagnostics.py tests/test_automation_control_center.py tests/test_connector_diagnostics.py
      - name: Compile changed Python files
        run: python -m py_compile api/automation.py routers/home.py automation/connector_diagnostics.py tests/test_automation_control_center.py tests/test_connector_diagnostics.py
      - name: Automation regression tests
        run: python -m pytest -q tests/test_automation_control_center.py tests/test_automation_template_install.py tests/test_automation_flagship.py tests/test_connector_diagnostics.py
