name: OmniFactory Customer Portal smoke tests

on:
  push:
    branches:
      - feat/customer-portal-neon-foundation-20261109
  pull_request:
    branches:
      - feat/phase1-studio-platform-navigation-20261109
      - OMNIFACTORY_14

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" python-multipart
      - name: Check Python sources
        run: python -m py_compile portal/db.py portal/models.py portal/security.py portal/routes.py portal/billing.py portal/billing_routes.py portal/billing_admin.py server.py
      - name: Run portal migration and auth tests
        run: python -m pytest -q tests/test_customer_portal.py
      - name: Verify billing and subscription ledger
        run: python -m pytest -q tests/test_subscription_billing.py
      - name: Retest existing routes and builder
        run: python -m pytest -q tests/test_studio_platform_phase1.py tests/test_platform_routes.py tests/test_simple_builder.py
