name: Telegram Runtime Durable State — PostgreSQL Acceptance
on:
  push:
    branches: [feat/telegram-runtime-durable-state-20261114]
  pull_request:
    branches: [feat/telegram-runtime-v1-20261114, test/subscriptions]
jobs:
  durable-state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni_test
          POSTGRES_PASSWORD: ci_only_secret
          POSTGRES_DB: omni_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U omni_test -d omni_runtime_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      OMNI_TEST_RUNTIME_POSTGRES_URL: postgresql://omni_test:ci_only_secret@127.0.0.1:5432/omni_runtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portal + runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart "aiogram==3.22.0" "asyncpg==0.31.0"
      - name: Syntax validation
        run: |
          python -m py_compile runtime/telegram/state.py runtime/telegram/app.py runtime/telegram/scenario.py api/telegram_runtime.py
      - name: Durable state and webhook regression tests
        run: |
          python -m pytest -q --tb=short tests/test_telegram_runtime_state.py tests/test_telegram_runtime_v1.py tests/test_secure_release.py tests/test_bot_security.py
      - name: Container build
        run: |
          docker build -f runtime/telegram/Dockerfile -t omnifactory-telegram-runtime:durable .
