name: Managed Cloud foundation checks

on:
  push:
    branches:
      - feat/managed-cloud-foundation-20261114
  pull_request:
    branches:
      - feat/automation-runtime-v1-20261114
      - test/subscriptions

jobs:
  managed-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" python-multipart
      - name: Compile all changed Python files
        run: |
          python -m py_compile automation/deployment.py api/cloud_deploy.py portal/models.py server.py routers/home.py
          node --check omni_site/static/cloud_deploy.js
      - name: Run cloud, automation and portal tests
        run: |
          python -m pytest -q tests/test_cloud_deploy.py tests/test_automation_engine.py tests/test_automation_api.py tests/test_automation_studio.py tests/test_customer_portal.py
