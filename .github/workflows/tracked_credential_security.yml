name: Tracked Credential Security Gate
on:
  pull_request:
  push:
    branches:
      - "feat/graph-runtime-incident-triage-20261121"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tracked credentials
        run: python -m scripts.check_tracked_credentials
      - name: Install test tooling
        run: python -m pip install "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Ruff
        run: python -m ruff check scripts/check_tracked_credentials.py tests/test_tracked_credentials.py
      - name: Security regressions
        run: python -m pytest -q tests/test_tracked_credentials.py
