name: OmniFactory Bot Security and Tenant Access

on:
  push:
    branches:
      - feat/bot-lab-tenant-security-20261114
  pull_request:
    branches:
      - test/subscriptions

jobs:
  security-and-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart
      - name: Validate Python and UI JavaScript syntax
        run: |
          python -m py_compile automation/bot_vault.py api/bot_security.py portal/models.py server.py portal/migrations/versions/20261114_portal_09.py
          node --check omni_site/static/bot_lab.js
      - name: Run security and existing integration regression tests
        run: |
          python -m pytest -q --tb=short \
            tests/test_bot_security.py \
            tests/test_bot_lab.py \
            tests/test_builder_projects.py \
            tests/test_railway_oauth.py \
            tests/test_cloud_deploy.py \
            tests/test_cloud_provisioning.py \
            tests/test_railway_resource_bindings.py \
            tests/test_automation_api.py
