name: OmniFactory Recovered Feature Gates
on:
  pull_request:
    paths:
      - "automation/**"
      - "api/automation*.py"
      - "runtime/telegram/**"
      - "portal/models.py"
      - "portal/migrations/versions/**"
      - "portal/client_projects.py"
      - "portal/growth_admin.py"
      - "omni_site/automation_flagship*"
      - "tests/test_automation*.py"
      - "tests/test_connection*.py"
      - "tests/test_connector_diagnostics.py"
      - "tests/test_telegram*.py"
      - "tests/test_project_delivery_approval_gate.py"
      - ".github/workflows/recovered_feature_gates.yml"
  push:
    branches:
      - "feat/graph-runtime-incident-triage-20261121"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovered-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovered-regressions:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [automation, telegram, delivery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Automation security and connector contracts
        if: matrix.group == 'automation'
        run: |
          python -m ruff check automation/connection_health.py automation/connection_vault.py automation/oauth_providers.py automation/oauth_state.py automation/connector_diagnostics.py api/automation_connections.py api/automation_oauth.py
          python -m pytest -q tests/test_automation_connections.py tests/test_connector_diagnostics.py tests/test_connection_health.py tests/test_automation_oauth.py tests/test_connection_vault.py tests/test_automation_control_center.py tests/test_automation_template_install.py tests/test_automation_flagship.py
      - name: Telegram production and persistence contracts
        if: matrix.group == 'telegram'
        run: |
          python -m pytest -q tests/test_telegram_runtime_production.py tests/test_telegram_outbox.py tests/test_telegram_runtime_state.py
      - name: Client handover approval gate
        if: matrix.group == 'delivery'
        run: |
          python -m pytest -q tests/test_project_delivery_approval_gate.py
      - name: Migration chain
        if: matrix.group == 'delivery'
        env:
          OMNI_PORTAL_DATABASE_URL: sqlite:///./recovered_gates.sqlite3
        run: |
          python -m alembic -c portal_alembic.ini heads
          python -m alembic -c portal_alembic.ini upgrade head
