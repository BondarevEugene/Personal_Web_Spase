name: OmniFactory Studio + Builder smoke tests

on:
  push:
    branches:
      - feat/phase1-studio-platform-navigation-20261109
  pull_request:
    branches:
      - OMNIFACTORY_14

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10"
      - name: Compile Python sources
        run: python -m py_compile core/templates.py routers/home.py server.py api/simple_builder.py
      - name: Check browser JavaScript syntax
        run: |
          node --check omni_site/static/builder.js
          node --check omni_site/static/site.js
      - name: Targeted route and builder tests
        run: python -m pytest -q tests/test_studio_platform_phase1.py tests/test_platform_routes.py tests/test_simple_builder.py
