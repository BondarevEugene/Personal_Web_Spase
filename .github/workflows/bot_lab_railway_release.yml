name: Bot Lab Railway BYOC release checks

on:
  push:
    branches:
      - feat/bot-lab-release-ops-20261114
  pull_request:
    branches:
      - feat/railway-provisioning-jobs-20261114
      - test/subscriptions

jobs:
  railway-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install target dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart
      - name: Validate syntax and mounted app
        run: |
          python -m py_compile automation/railway_inspection.py api/railway_resources.py api/bot_lab.py portal/models.py server.py
          node --check omni_site/static/bot_lab.js
      - name: Run BYOC resource and existing Cloud regression tests
        run: |
          python -m pytest -q tests/test_railway_resource_bindings.py tests/test_cloud_provisioning.py tests/test_bot_lab.py tests/test_railway_inventory.py tests/test_cloud_deploy.py tests/test_railway_oauth.py
