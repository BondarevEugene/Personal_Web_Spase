name: OmniFactory Managed Cloud Secure Release

on:
  push:
    branches:
      - feat/managed-cloud-secure-release-20261114
  pull_request:
    branches:
      - test/subscriptions

jobs:
  secure-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart
      - name: Validate syntax
        run: |
          python -m py_compile automation/release_gate.py api/cloud_releases.py portal/migrations/versions/20261114_portal_10.py server.py
          node --check omni_site/static/bot_lab.js
          node --check omni_site/static/bot_lab_release.js
      - name: Verify release gate and regressions
        run: |
          python -m pytest -q --tb=short tests/test_secure_release.py tests/test_bot_security.py tests/test_bot_lab.py tests/test_cloud_provisioning.py tests/test_railway_resource_bindings.py tests/test_builder_projects.py
