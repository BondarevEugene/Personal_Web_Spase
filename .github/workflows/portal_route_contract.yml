name: Portal routing and OpenAPI regression

on:
  push:
    branches: [fix/portal-openapi-botlab-20261115]
  pull_request:
    branches: [feat/graph-studio-workspace-20261115, test/subscriptions]

jobs:
  verify-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart "aiogram>=3.20,<4"
      - name: Validate OpenAPI generation, redirects and UI assets
        run: python -m pytest -q -vv tests/test_portal_route_contract.py
