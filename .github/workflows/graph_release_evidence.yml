name: Graph Studio release evidence
on:
  pull_request:
    paths:
      - "api/graph_release_evidence.py"
      - "api/builder_projects.py"
      - "tests/test_graph_release_evidence.py"
      - ".github/workflows/graph_release_evidence.yml"
  workflow_dispatch:
jobs:
  graph-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "ruff>=0.9,<1" "pytest>=8,<10"
      - run: python -m ruff check api/graph_release_evidence.py tests/test_graph_release_evidence.py
      - run: python -m pytest -q tests/test_graph_release_evidence.py
