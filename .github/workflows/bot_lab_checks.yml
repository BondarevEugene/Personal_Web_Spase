name: OmniFactory Bot Lab checks

on:
  push:
    branches:
      - feat/bot-lab-provisioning-20261114
  pull_request:
    branches:
      - feat/railway-oauth-vault-20261114
      - test/subscriptions

jobs:
  bot-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart
      - name: Python and JavaScript syntax
        run: |
          python -m py_compile api/bot_lab.py automation/railway_inventory.py routers/home.py routers/admin.py server.py
          node --check omni_site/static/bot_lab.js
      - name: Lab, Railway and Cloud regression tests
        run: |
          python -m pytest -q tests/test_bot_lab.py tests/test_railway_inventory.py tests/test_cloud_deploy.py tests/test_railway_oauth.py
