name: OMNIFACTORY builder workflow UI

on:
  pull_request:
    branches:
      - feat/founders-omni-editorial-20261116
    paths:
      - "templates/builder_pro_final.html"
      - "tests/test_builder_workflow_ui.py"
      - ".github/workflows/builder_workflow_ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Ruff
        run: python -m ruff check tests/test_builder_workflow_ui.py
      - name: Workflow UI and backend tests
        run: python -m pytest -q --tb=short tests/test_builder_workflow_ui.py tests/test_builder_final_workflow.py tests/test_builder_preflight_export_gate.py
