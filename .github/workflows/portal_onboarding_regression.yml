name: OmniFactory Onboarding Regression

on:
  push:
    branches:
      - fix/portal-onboarding-db-ui-20261109
  pull_request:
    branches:
      - feat/paid-subscriptions-billing-neon-20261109

jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" python-multipart
      - name: Compile changed modules
        run: python -m py_compile portal/bootstrap.py portal/doctor.py portal/routes.py core/lifespan.py
      - name: Run onboarding and account checks
        run: python -m pytest -q tests/test_portal_onboarding.py tests/test_customer_portal.py
      - name: Run subscription and platform regression
        run: python -m pytest -q tests/test_subscription_billing.py tests/test_platform_routes.py tests/test_simple_builder.py tests/test_studio_platform_phase1.py
