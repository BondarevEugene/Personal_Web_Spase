name: Automation OAuth Integration
on:
  pull_request:
    paths:
      - "automation/oauth_providers.py"
      - "automation/oauth_state.py"
      - "api/automation_oauth.py"
      - "api/automation_connections.py"
      - "portal/models.py"
      - "portal/migrations/versions/20261121_portal_22.py"
      - "server.py"
      - "tests/test_automation_oauth.py"
      - ".github/workflows/automation-oauth.yml"
  push:
    branches:
      - "feat/automation-real-oauth-20261121"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Ruff
        run: python -m ruff check automation/oauth_providers.py automation/oauth_state.py api/automation_oauth.py api/automation_connections.py portal/migrations/versions/20261121_portal_22.py tests/test_automation_oauth.py
      - name: Compile
        run: python -m py_compile automation/oauth_providers.py automation/oauth_state.py api/automation_oauth.py api/automation_connections.py portal/models.py portal/migrations/versions/20261121_portal_22.py server.py
      - name: Tests
        run: python -m pytest -q tests/test_automation_oauth.py tests/test_connection_vault.py tests/test_automation_connections.py
      - name: Alembic
        env:
          OMNI_PORTAL_DATABASE_URL: sqlite:///./oauth_ci.sqlite3
        run: python -m alembic -c portal_alembic.ini upgrade head
