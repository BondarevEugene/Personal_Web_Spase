name: OmniFactory Automation runtime and Graph Studio

on:
  push:
    branches:
      - feat/automation-runtime-v1-20261114
  pull_request:
    branches:
      - feat/builder-logic-nodes-20261114
      - test/subscriptions

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install targeted dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" python-multipart
      - name: Validate source compilation
        run: |
          python -m py_compile automation/engine.py automation/diagnostics.py automation/scheduler.py api/automation.py api/builder_projects.py portal/models.py server.py
          node --check omni_site/static/automation_studio.js
          node --check omni_site/static/graph_studio.js
      - name: Run Automation engine, database and UI tests
        run: |
          python -m pytest -q tests/test_automation_engine.py tests/test_automation_api.py tests/test_automation_studio.py tests/test_automation_schedule.py tests/test_builder_logic_nodes.py tests/test_builder_projects.py tests/test_simple_builder.py tests/test_customer_portal.py
