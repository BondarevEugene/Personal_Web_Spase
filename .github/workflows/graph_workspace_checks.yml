name: Graph Studio workspace and Telegram Runtime checks

on:
  push:
    branches:
      - feat/graph-studio-workspace-20261115
  pull_request:
    branches:
      - feat/telegram-runtime-v1-20261114
      - test/subscriptions

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portal and runtime test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart "aiogram>=3.20,<4"
      - name: Verify JavaScript and Python syntax
        run: |
          node --check omni_site/static/graph_workspace.js
          node --check omni_site/static/graph_studio.js
          python -m py_compile runtime/telegram/app.py runtime/telegram/scenario.py
      - name: Graph Studio and bot runtime regression tests
        run: |
          python -m pytest -q --tb=short tests/test_graph_workspace_ui.py tests/test_builder_logic_nodes.py tests/test_builder_projects.py tests/test_telegram_runtime_v1.py
