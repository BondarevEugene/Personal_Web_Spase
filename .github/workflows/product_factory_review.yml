name: OMNIFACTORY Product Factory review

on:
  pull_request:
    branches:
      - feat/founders-omni-editorial-20261116
    paths:
      - "api/product_factory.py"
      - "tests/test_product_factory_review.py"
      - ".github/workflows/product_factory_review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10" "ruff>=0.9,<1"
      - name: Ruff
        run: python -m ruff check api/product_factory.py tests/test_product_factory_review.py
      - name: Review and foundation tests
        run: python -m pytest -q --tb=short tests/test_product_factory_review.py tests/test_product_factory_foundation.py
