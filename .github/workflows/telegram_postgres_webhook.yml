name: Telegram PostgreSQL Webhook Contract
on:
  pull_request:
    paths:
      - "runtime/telegram/**"
      - "tests/test_telegram_postgres_webhook.py"
      - "tests/test_telegram_outbox_worker.py"
      - "tests/test_telegram_delivery_engine.py"
      - "tests/test_telegram_postgres_integration.py"
      - ".github/workflows/telegram_postgres_webhook.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: omni_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni -d omni_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNI_TEST_POSTGRES_DSN: postgresql://omni:test_only_password@localhost:5432/omni_runtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r runtime/telegram/requirements.txt pytest ruff
      - run: python -m ruff check runtime/telegram/postgres_webhook.py runtime/telegram/outbox_worker.py runtime/telegram/outbox.py runtime/telegram/postgres_state.py tests/test_telegram_delivery_engine.py tests/test_telegram_postgres_webhook.py tests/test_telegram_outbox_worker.py runtime/telegram/postgres_diagnostics.py tests/test_telegram_postgres_integration.py
      - run: python -m pytest -q tests/test_telegram_postgres_webhook.py tests/test_telegram_runtime_production.py tests/test_telegram_outbox_worker.py tests/test_telegram_delivery_engine.py tests/test_telegram_postgres_integration.py
