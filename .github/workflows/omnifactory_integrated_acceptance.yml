name: OmniFactory integrated platform acceptance

on:
  push:
    branches:
      - feat/bot-lab-release-ops-20261114
  pull_request:
    branches:
      - feat/railway-provisioning-jobs-20261114
      - test/subscriptions

jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi~=0.136.1" "pydantic>=2,<3" "httpx>=0.27,<1" "SQLAlchemy>=2,<3" "Jinja2>=3,<4" "pytest>=8,<10" "argon2-cffi>=23,<26" "alembic>=1.14,<2" "cryptography>=43,<48" python-multipart
      - name: Validate Python and JS syntax
        run: |
          python -m compileall -q automation api/cloud_deploy.py api/automation.py api/railway_resources.py api/railway_connections.py api/cloud_provision.py api/bot_lab.py portal/models.py server.py
          node --check omni_site/static/automation_studio.js
          node --check omni_site/static/graph_studio.js
          node --check omni_site/static/bot_lab.js
          node --check omni_site/static/cloud_deploy.js
      - name: Run cross-product integration tests
        run: |
          python -m pytest -q --tb=short \
            tests/test_platform_navigation.py \
            tests/test_builder_projects.py \
            tests/test_builder_logic_nodes.py \
            tests/test_simple_builder.py \
            tests/test_automation_engine.py \
            tests/test_automation_api.py \
            tests/test_automation_schedule.py \
            tests/test_automation_studio.py \
            tests/test_cloud_deploy.py \
            tests/test_railway_oauth.py \
            tests/test_railway_inventory.py \
            tests/test_bot_lab.py \
            tests/test_cloud_provisioning.py \
            tests/test_railway_resource_bindings.py
