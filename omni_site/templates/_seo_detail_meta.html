{# SEO is emitted only for the explicitly configured HTTPS public origin. #}
{% if seo_origin %}
{% set canonical_url = seo_origin ~ seo_path %}
<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:site_name" content="OMNIFACTORY">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<script type="application/ld+json">{{ {
  "@context": "https://schema.org",
  "@type": seo_schema_type,
  "headline": seo_title,
  "description": seo_description,
  "url": canonical_url,
  "inLanguage": "ru",
  "publisher": {"@type": "Organization", "name": "OMNIFACTORY", "url": seo_origin}
} | tojson }}</script>
{% endif %}
